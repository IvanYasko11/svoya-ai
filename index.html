<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СВОЯ AI — Operator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0b1020;color:#eef2ff}
.wrap{max-width:1000px;margin:0 auto;padding:48px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
h1{font-size:42px;margin:0 0 8px}.muted{color:#9aa6c0}.badge{padding:8px 12px;border:1px solid #33405f;border-radius:999px;font-size:13px}
.card{margin-top:28px;background:#11182b;border:1px solid #26324d;border-radius:18px;padding:22px}
textarea{width:100%;min-height:120px;background:#0b1020;color:#fff;border:1px solid #33405f;border-radius:12px;padding:14px;font:inherit;resize:vertical}
button{margin-top:12px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.status{display:flex;align-items:center;gap:8px;margin-top:16px}.dot{width:9px;height:9px;border-radius:50%;background:#6ee7b7}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.step{padding:14px;border:1px solid #26324d;border-radius:12px}.num{font-size:12px;color:#7f8ba5}.risk{margin-top:18px;padding:14px;border-radius:12px;background:#0d1426}.verify{margin-top:12px;padding:14px;border:1px solid #26324d;border-radius:12px}.result{margin-top:18px;white-space:pre-wrap;line-height:1.5}.activity{margin-top:16px;padding:14px;border:1px solid #26324d;border-radius:12px;background:#0d1426;display:none}.activity.active{display:block}.activity-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #33405f;border-top-color:#6ee7b7;border-radius:50%;animation:spin .8s linear infinite}.timer{font-variant-numeric:tabular-nums;color:#9aa6c0}.progress{height:5px;background:#1a243b;border-radius:999px;overflow:hidden;margin-top:10px}.progress-bar{height:100%;width:0;background:#6ee7b7;transition:width .3s ease}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.steps{grid-template-columns:1fr}h1{font-size:32px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div><h1>СВОЯ AI</h1><div class="muted">Личный AI-оператор</div></div><div class="badge">V1.3 • Autopilot</div></div>
<section class="card">
<div class="muted">Команда</div>
<textarea id="task" placeholder=""></textarea>
<button id="run">Запустить</button>
<div class="status"><span class="dot"></span><span id="status">Готов к запуску</span></div><div class="activity" id="activity"><div class="activity-head"><span><span class="spinner"></span> <span id="activityText">Запускаю…</span></span><span class="timer" id="timer">0.0 с</span></div><div class="progress"><div class="progress-bar" id="progressBar"></div></div></div>
<div class="steps">
<div class="step"><div class="num">01</div>Понять задачу</div><div class="step"><div class="num">02</div>Проверить риск</div><div class="step"><div class="num">03</div>Выбрать LLM</div>
<div class="step"><div class="num">04</div>Выполнить</div><div class="step"><div class="num">05</div>Проверить</div><div class="step"><div class="num">06</div>Ответить</div>
</div>
<div class="risk"><b>Risk Gate:</b> <span id="risk">ожидает проверки сервером</span><br><b>Router:</b> <span id="route">ожидает классификации</span></div>
<div class="verify"><b>Verifier:</b> <span id="verify">ожидает выполнения</span></div>
<div class="result" id="result"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);

// Поле команды всегда пустое. Подсказка меняется при каждом открытии страницы.
const examples=[
  "Что сейчас происходит в мире ИИ?",
  "Найди способ заработать первые деньги онлайн без вложений.",
  "Проверь эту идею на слабые места.",
  "Напиши простой код и объясни, как он работает.",
  "Сравни несколько вариантов и покажи различия.",
  "Исследуй тему и дай короткий вывод.",
  "Помоги мне автоматизировать эту задачу.",
  "Разбери мой план в режиме Red Team."
];
const taskInput=$("task");
taskInput.placeholder=examples[Math.floor(Math.random()*examples.length)];



function verifyResponse(data, task){
  const answer=typeof data?.answer==="string"?data.answer.trim():"";
  const checks=[
    ["Ответ существует",answer.length>0],
    ["Провайдер указан",typeof data?.provider==="string"&&data.provider.length>0],
    ["Модель указана",typeof data?.model==="string"&&data.model.length>0],
    ["Запрос не пустой",task.trim().length>0],
    ["Risk Gate LOW",data?.risk_level==="LOW"&&data?.requires_confirmation===false]
  ];
  const passed=checks.filter(x=>x[1]).length;
  return {ok:passed===checks.length,summary:`${passed}/${checks.length} технических проверок пройдено`};
}

$("run").onclick=async()=>{
 const task=$("task").value.trim();
 if(!task){$("result").textContent="Введите команду.";return}
 const stages=["Понимаю задачу…","Проверяю риск…","Выбираю маршрут…","Отправляю запрос модели…","Получаю ответ…","Проверяю результат…"];
 const activityMessages=["Анализирую запрос…","Проверяю безопасность…","Определяю подходящий маршрут…","Модель работает над задачей…","Проверяю полученный результат…"];
 let stageIndex=0, progress=0;
 const started=performance.now();
 $("run").disabled=true;$("result").textContent="";$("verify").textContent="выполняется…";$("risk").textContent="проверяется сервером…";$("route").textContent="классифицируется…";
 $("activity").classList.add("active"); $("activityText").textContent=activityMessages[0]; $("progressBar").style.width="8%";
 const timerId=setInterval(()=>{$("timer").textContent=((performance.now()-started)/1000).toFixed(1)+" с"},100);
 const activityId=setInterval(()=>{stageIndex=Math.min(stageIndex+1,activityMessages.length-1);$("activityText").textContent=activityMessages[stageIndex];progress=Math.min(progress+16,82);$("progressBar").style.width=progress+"%"},700);
 try{
   $("status").textContent=stages[0]; await new Promise(r=>setTimeout(r,250));
   $("status").textContent=stages[1];
   const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task})});
   const data=await response.json();

   if(data?.risk_level){
     $("risk").textContent=data.risk_level+(data.requires_confirmation?" — требуется подтверждение":" — разрешено");$("route").textContent=(data.intent||"UNKNOWN")+" → "+(data.route||"UNKNOWN");
   }

   if(!response.ok){
     $("verify").textContent=data?.requires_confirmation?"BLOCK — Risk Gate":"FAIL";
     $("status").textContent=data?.requires_confirmation?"Остановлено Risk Gate":"Нужна настройка";
     $("result").textContent=(data?.requires_confirmation?"ТРЕБУЕТСЯ ПОДТВЕРЖДЕНИЕ\n\n":"НЕ ГОТОВО\n\n")+(data?.error||"Ошибка API");
     return;
   }

   $("status").textContent=stages[2]; await new Promise(r=>setTimeout(r,250));
   $("status").textContent=stages[3];
   $("status").textContent=stages[4];
   const verification=verifyResponse(data,task);
   $("verify").textContent=verification.ok?"TECHNICAL PASS — "+verification.summary:"TECHNICAL FAIL — "+verification.summary;
   if(!verification.ok) throw new Error("Ответ не прошёл техническую проверку.");
   $("progressBar").style.width="100%"; $("activityText").textContent="Готово — ответ проверен.";
   await new Promise(r=>setTimeout(r,200));
   $("status").textContent=stages[5]; await new Promise(r=>setTimeout(r,200));
   $("status").textContent="Готово";
   $("result").textContent="PASS\n\n"+data.answer+"\n\nПровайдер: "+data.provider+"\nМодель: "+data.model;
   if(data.route==="CODING_AGENT" && data.task_id){
     $("activityText").textContent="Coding Agent запущен — жду результат…";
     let attempts=0;
     const poll=async()=>{
       attempts++;
       try{
         const sr=await fetch("/api/coding-status?task_id="+encodeURIComponent(data.task_id));
         const sd=await sr.json();
         if(sd.status==="completed"){
           $("activityText").textContent="Coding Agent завершил работу.";
           $("result").textContent+="\n\nСтатус агента: COMPLETED\nRun: "+sd.run_id;
           $("status").textContent="Готово";
           if(sd.url) $("result").textContent+="\nGitHub Actions: "+sd.url;
           return;
         }
         if(sd.status==="failed"){
           $("activityText").textContent="Coding Agent завершил работу с ошибкой.";
           $("result").textContent+="\n\nСтатус агента: FAILED\nRun: "+sd.run_id;
           $("status").textContent="Агент завершил с ошибкой";
           return;
         }
         if(attempts<15){
           $("activityText").textContent="Coding Agent работает… попытка "+attempts+"/15";
           setTimeout(poll,2000);
         }else{
           $("activityText").textContent="Агент продолжает работу в GitHub Actions.";
           $("result").textContent+="\n\nСтатус агента: RUNNING/QUEUED";
         }
       }catch{
         if(attempts<15) setTimeout(poll,2000);
       }
     };
     setTimeout(poll,1500);
   }
 }catch(e){
   $("activityText").textContent="Выполнение остановлено.";
   $("progressBar").style.width="100%";
   $("status").textContent="Ошибка";
   $("verify").textContent="FAIL";
   $("result").textContent="НЕ ГОТОВО\n\n"+e.message;
 }finally{
   clearInterval(timerId);clearInterval(activityId);
   $("run").disabled=false;
 }
};
</script>
</body>
</html>
