name: Task organizer checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [ai/task-organizer]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/organizer.test.cjs
      - run: node scripts/organizer-ui.test.cjs
      - run: node scripts/organizer-proposals.test.cjs
      - run: node scripts/organizer-plan.test.mjs
      - run: node scripts/cloud-backup.test.cjs
      - run: node scripts/cloud-ui.test.cjs
      - run: node scripts/chat.test.mjs
      - run: node scripts/operator-auth.test.cjs
      - run: node scripts/chat-auth.test.mjs
      - run: node scripts/coding-status.test.mjs
      - run: node scripts/app-shell.test.cjs
      - run: node --check app-shell.js
      - run: node scripts/chat-ui.test.cjs
      - run: node scripts/provider-router.test.cjs
      - run: node --check organizer-ui.js
      - run: node --check cloud-ui.js
      - run: node --check api/chat.js
      - run: node --check api/coding-status.js
      - run: node --check api/organizer-plan.js
