name: SVoya AI Coding Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task for the agent"
        required: true
        type: string
      model:
        description: "OpenRouter model"
        required: false
        default: "cohere/north-mini-code:free"
        type: string

# TEST MODE: the agent may edit the temporary runner workspace,
# but this workflow cannot push or modify the repository.
permissions:
  contents: read

jobs:
  coding-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenCode
        run: npm install --global @opencode/cli

      - name: Run OpenCode coding agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODING_TASK: ${{ inputs.task }}
          CODING_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::GitHub secret OPENROUTER_API_KEY is not configured."
            exit 1
          fi

          opencode run             --standalone             --model "openrouter/$CODING_MODEL"             --format default             "$CODING_TASK"

      - name: Collect test results
        if: always()
        run: |
          {
            echo "=== Git status ==="
            git status --short
            echo
            echo "=== Diff stat ==="
            git diff --stat
            echo
            echo "=== Diff ==="
            git diff --binary
          } > coding-agent-report.txt

          git diff --binary > coding-agent.patch

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coding-agent-test-results
          path: |
            coding-agent-report.txt
            coding-agent.patch

      - name: Safety check
        if: always()
        run: |
          echo "TEST MODE: no commit and no push are performed."
          echo "Changes, if any, are available only in the workflow artifacts."
