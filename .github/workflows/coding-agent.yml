name: SVoya AI Coding Agent
run-name: "Coding Agent • ${{ github.event.client_payload.task_id || github.run_id }}"

# Vercel redeploy trigger: 2026-09-25

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task for the agent"
        required: true
        type: string
      model:
        description: "OpenRouter model"
        required: false
        default: "cohere/north-mini-code:free"
        type: string
      apply_changes:
        description: "Create a commit with verified changes"
        required: false
        default: "false"
        type: string
  repository_dispatch:
    types: [svoya-coding-task]

permissions:
  contents: write

jobs:
  coding-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Read task
        id: task
        env:
          DISPATCH_TASK: ${{ github.event.client_payload.task }}
          DISPATCH_MODEL: ${{ github.event.client_payload.model }}
          DISPATCH_APPLY: ${{ github.event.client_payload.apply_changes }}
          INPUT_TASK: ${{ inputs.task }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_APPLY: ${{ inputs.apply_changes }}
        run: |
          TASK="${DISPATCH_TASK:-$INPUT_TASK}"
          MODEL="${DISPATCH_MODEL:-${INPUT_MODEL:-cohere/north-mini-code:free}}"
          APPLY="${DISPATCH_APPLY:-${INPUT_APPLY:-false}}"

          if [ -z "$TASK" ]; then
            echo "::error::No coding task supplied."
            exit 1
          fi

          echo "task<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$TASK" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"

      - name: Install OpenCode
        run: npm install --global @opencode/cli

      - name: Run OpenCode coding agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODING_TASK: ${{ steps.task.outputs.task }}
          CODING_MODEL: ${{ steps.task.outputs.model }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::GitHub secret OPENROUTER_API_KEY is not configured."
            exit 1
          fi

          opencode run \
            --standalone \
            --model "openrouter/$CODING_MODEL" \
            --format default \
            "$CODING_TASK"

      - name: Verify changes
        id: verify
        run: |
          echo "=== Git status ==="
          git status --short
          echo
          echo "=== Diff stat ==="
          git diff --stat

          if git diff --quiet && [ -z "$(git status --short)" ]; then
            echo "::warning::CODING AGENT VERIFIER: no repository changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "CODING AGENT VERIFIER: PASS — repository changes detected."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create safe commit
        if: steps.verify.outputs.changed == 'true' && steps.task.outputs.apply == 'true'
        run: |
          git config user.name "SVoya AI Coding Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ai): apply coding agent task"
          git push

      - name: Collect report
        if: always()
        run: |
          {
            echo "=== Task ==="
            printf '%s\n' "${{ steps.task.outputs.task }}"
            echo
            echo "=== Apply changes ==="
            echo "${{ steps.task.outputs.apply }}"
            echo
            echo "=== Git status ==="
            git status --short
            echo
            echo "=== Diff stat ==="
            git diff --stat
            echo
            echo "=== Diff ==="
            git diff --binary
          } > coding-agent-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coding-agent-results
          path: coding-agent-report.txt
